StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Tolka

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, TolkaStyle
# Lowercase "tolka" is correct (not a brand-name typo) inside npm scopes,
# hostnames, and custom-element tag names — only flag it in prose.
TokenIgnores = (@tolka/[a-z0-9-]+), (tolka\.health), ([a-z0-9.]+\.tolka\.health), (</?tolka-[a-z-]+>?), (tolka-[a-z-]+)
# Fenced code blocks aren't otherwise excluded from prose checks under the
# `mdx = md` format mapping — this repo's spelling/terminology rules were
# firing on code identifiers (errorRate, instanceof, @tolka/web-sdk, etc.)
# before this was added.
BlockIgnores = (?s)```.*?```

[src/content/docs/*.mdx]
BasedOnStyles = Vale, TolkaStyle

